[project]
name = "hyperagent-demo-project"
version = "0.1.0"
description = "A Streamlit template with LangChain AI logic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "docx2txt>=0.8",
    "python-docx>=1.1.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "pypdf>=6.12.2",
    "langfuse>=4.7.1",
]
[tool.setuptools.packages.find]
where = ["."]
[dependency-groups]
dev = []

[tool.pyright]
extraPaths = ["app"]
